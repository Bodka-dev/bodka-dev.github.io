<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BODKA | Game Dev & Tools Specialist</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #12161f;
      --cyan-main: #40e0d0;
      --cyan-glow: rgba(64, 224, 208, 0.4);
      --text-main: #e6f1ff;
      --text-muted: #8892b0;
      --black: #000000;
      --border: rgba(64, 224, 208, 0.2);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    header { padding: 2rem 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo-container { display: flex; align-items: center; gap: 12px; }
    .logo-circle { width: 45px; height: 45px; border-radius: 50%; background: var(--cyan-main); border: 3px solid var(--black); outline: 2px solid var(--cyan-main); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; color: var(--black); }
    .logo-text { font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; }
    nav a { color: var(--text-muted); text-decoration: none; margin-left: 2rem; font-weight: 600; }
    nav a.active { color: var(--cyan-main); }
    .hero { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 span { color: var(--cyan-main); }
    .btn-large { display: inline-flex; align-items: center; gap: 10px; background: var(--cyan-main); color: var(--black); padding: 1.2rem 2.5rem; font-size: 1.2rem; font-weight: 700; border-radius: 8px; text-decoration: none; width: fit-content; }
    .contact-links { display: flex; gap: 1rem; margin-top: 1rem; }
    .contact-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 0.8rem 1.2rem; border-radius: 8px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-circle">B</div>
        <div class="logo-text">BODKA</div>
      </div>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="products.html">Products & Tools</a>
      </nav>
    </header>
    <section class="hero">
      <h1>Accelerating <span>Game Development</span></h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem; max-width: 600px;">
        Programujem hry a vyvíjam špeciálne nástroje pre Unity, Unreal Engine a VS Code, ktoré zrýchľujú vývoj nových hier.
      </p>
      <a href="products.html" class="btn-large"><i class="fa-solid fa-rocket"></i> Browse Game Dev Tools</a>
    </section>
    <section style="padding: 2rem 0;">
      <h2>Kontaktujte ma</h2>
      <div class="contact-links">
        <a href="mailto:blejzr11@gmail.com" class="contact-btn"><i class="fa-solid fa-envelope" style="color: var(--cyan-main);"></i> blejzr11@gmail.com</a>
        <a href="https://www.instagram.com/badkaediting/" target="_blank" class="contact-btn"><i class="fa-brands fa-instagram" style="color: var(--cyan-main);"></i> @badkaediting</a>
      </div>
    </section>
  </div>
</body>
</html>
