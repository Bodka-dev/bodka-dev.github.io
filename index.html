<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <!-- 1. KĽÚČOVÉ: Viewport tag pre správne škálovanie na mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textures Creator v1.0</title>
    <style>
        /* Základný štýl */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: #1f1f1f;
            border-bottom: 1px solid #333;
        }

        /* Hlavný kontajner pre rozloženie stránky */
        .main-container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Ľavý/Pravý panel s ovládacími prvkami */
        .control-panel {
            flex: 1;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* Stredná časť s náhľadom / plátnom */
        .canvas-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* Responzívne plátno */
        canvas {
            width: 100%;
            max-width: 500px;
            height: auto;
            aspect-ratio: 1 / 1;
            background-color: #000;
            border-radius: 4px;
        }

        button, select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7b1fa2;
        }

        /* 2. KĽÚČOVÉ: Media Query pre mobily (obrazovky užšie ako 768px) */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column; /* Zmení vedľajšie stĺpce na usporiadanie pod sebou */
                padding: 10px;
                gap: 10px;
            }

            .control-panel, .canvas-container {
                width: 100%;
            }

            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Textures Creator v1.0</h1>
        <p>Fast procedural game textures generator</p>
    </header>

    <div class="main-container">
        <!-- Ovládacie prvky -->
        <div class="control-panel">
            <h3>Settings</h3>
            <p style="margin-top: 10px; color: #aaa;">Configure your texture parameters here:</p>
            <select>
                <option>Preset: Stone Wall</option>
                <option>Preset: Wood Bark</option>
                <option>Preset: Metal Rust</option>
            </select>
            <button>Generate Texture</button>
        </div>

        <!-- Plátno / Náhľad -->
        <div class="canvas-container">
            <h3>Preview</h3>
            <canvas id="textureCanvas" width="512" height="512"></canvas>
        </div>
    </div>

</body>
</html>
