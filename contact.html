<script>
    const canvas = document.getElementById('particles-canvas') || document.createElement('canvas');
    if (!document.getElementById('particles-canvas')) {
      canvas.id = 'particles-canvas';
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.zIndex = '0';
      canvas.style.pointerEvents = 'none';
      document.body.prepend(canvas);
    }
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Generovanie bodiek na povrchu gule (zemegula)
    const globeDots = [];
    const numDots = 150;
    const radius = 180;

    for (let i = 0; i < numDots; i++) {
      const phi = Math.acos(-1 + (2 * i) / numDots);
      const theta = Math.sqrt(numDots * Math.PI) * phi;
      globeDots.push({
        x: radius * Math.cos(theta) * Math.sin(phi),
        y: radius * Math.sin(theta) * Math.sin(phi),
        z: radius * Math.cos(phi)
      });
    }

    let angle = 0;

    function animateGlobe() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      angle += 0.008; // Rýchlosť otáčania

      globeDots.forEach(dot => {
        // Rotácia okolo Y osi
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const xRot = dot.x * cos - dot.z * sin;
        const zRot = dot.z * cos + dot.x * sin;

        // Projekcia na 2D obrazovku
        const scale = 400 / (400 + zRot);
        const x2d = xRot * scale + centerX;
        const y2d = dot.y * scale + centerY;

        const alpha = (zRot + radius) / (2 * radius) * 0.7 + 0.1;

        ctx.fillStyle = `rgba(64, 224, 208, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x2d, y2d, scale * 2, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animateGlobe);
    }
    animateGlobe();
  </script>
