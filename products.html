<script>
    const canvas = document.getElementById('particles-canvas') || document.createElement('canvas');
    if (!document.getElementById('particles-canvas')) {
      canvas.id = 'particles-canvas';
      canvas.style.position = 'fixed';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      canvas.style.zIndex = '0';
      canvas.style.pointerEvents = 'none';
      document.body.prepend(canvas);
    }
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const columns = Math.floor(canvas.width / 30);
    const drops = [];
    for (let i = 0; i < columns; i++) {
      drops[i] = Math.floor(Math.random() * -50);
    }

    function animateMatrix() {
      ctx.fillStyle = 'rgba(10, 12, 16, 0.15)'; // Efekt jemného rozostrenia stopy
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(64, 224, 208, 0.4)';
      ctx.font = '14px monospace';

      for (let i = 0; i < drops.length; i++) {
        // Vykreslíme bodku alebo štvorček pripomínajúci fragment kódu/systému
        const text = Math.random() > 0.5 ? '•' : '+';
        ctx.fillText(text, i * 30, drops[i] * 20);

        if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
      requestAnimationFrame(animateMatrix);
    }
    animateMatrix();
  </script>
